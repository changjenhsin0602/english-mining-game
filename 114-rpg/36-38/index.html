const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let state={level:0,idx:0,score:0,correct:0,wrong:[],results:[],allWrong:[],questions:[],name:"",cls:"",seat:"",levelStartedAt:0};let musicOn=false,ctx=null,timer=null,beat=0;const melody=[330,392,440,392,330,294,262,294,330,392,494,440,392,330,294,262];
function tone(freq,t,dur,volume=.04){if(!ctx||ctx.state!=="running")return;let o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=freq;g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur)}
async function startMusic(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(ctx.state!=="running")return;musicOn=true;$("music").textContent="🔊 音樂：開";if(!timer)timer=setInterval(()=>{try{tone(melody[beat%melody.length],ctx.currentTime,.18,.07);if(beat%4===0)tone(130,ctx.currentTime,.12,.035);beat++}catch(e){}},220)}catch(e){$("music").textContent="🔊 點此開啟音樂"}}
function toggleMusic(){if(musicOn){musicOn=false;clearInterval(timer);timer=null;ctx?.suspend();$("music").textContent="🔇 音樂：關"}else startMusic()}
function beep(ok){try{tone(ok?660:175,ctx.currentTime,.16,.1)}catch(e){}}
function makeQs(items,type,limit){let pool=items.map(([en,zh])=>({en,zh}));return shuffle(pool).slice(0,limit||pool.length).map(q=>{let other=shuffle([...new Set(pool.filter(x=>x!==q).map(x=>x.zh))]).slice(0,3);return {question:"「"+q.en+"」的中文意思是？",answer:q.zh,options:shuffle([q.zh,...other]),note:q.en+" → "+q.zh}})}
function fromTriple(x){return {question:x[0],answer:x[1],options:shuffle(x[2]),note:x[3]}}
function makeLevel(n){if(n===0)return makeQs(DATA.words,"zh");if(n===1)return makeQs(DATA.phrases,"zh");if(n===2)return shuffle(FACTS).map(fromTriple);if(n===3)return EXAMS.map(fromTriple);return shuffle([...makeQs(DATA.words,"zh",4),...makeQs(DATA.phrases,"zh",4),...shuffle(FACTS).slice(0,5).map(fromTriple),...EXAMS.map(fromTriple),...shuffle(SKILLS).slice(0,4).map(fromTriple)])}
function save(){try{localStorage.setItem("english114rpg3638",JSON.stringify(state))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem("english114rpg3638"));if(x&&Array.isArray(x.results))state={...state,...x}}catch(e){}}
function home(){let count=DATA.words.length+DATA.phrases.length+FACTS.length+EXAMS.length;$("app").innerHTML='<h2>🎮 自由選關・想玩哪關就玩哪關</h2><p>簡報內容共 '+count+' 個核心練習點，五關任選，不必按照順序，也不用通關才能玩下一關。</p>'+LEVELS.map((l,i)=>'<button class="level" style="display:block;width:100%;text-align:left;border:1px solid #5974a4" onclick="chooseLevel('+i+')">'+l.icon+' 第'+(i+1)+'關｜'+l.name+'　<span class="pill">'+(i===4?20:l.items.length)+'題</span>　▶ 立即挑戰</button>').join('')+'<p class="muted">每關可獨立挑戰，答題後有鼓勵回饋、錯題複習及重新挑戰。</p>'+(state.results.length?'<button onclick="finish()">🏆 查看累積成績</button> <button onclick="resetProgress()">重新開始記錄</button>':'')+'<p class="muted">可自由選擇關卡，無鎖關機制。</p>'}
function chooseLevel(i){if(!state.name||!state.cls||!state.seat){$("app").innerHTML='<h2>🪪 冒險者資料</h2><p>請先填寫資料，完成後就能直接截圖成績給老師。</p><label>班級<input id="cls" placeholder="班級" value="'+esc(state.cls||"")+'"></label><label>座號<input id="seat" placeholder="座號" value="'+esc(state.seat||"")+'"></label><label>姓名<input id="name" placeholder="姓名" value="'+esc(state.name||"")+'"></label><button class="primary" onclick="savePlayer('+i+')">開始挑戰 ⚔️</button> <button onclick="home()">返回選關</button>';return}state.level=i;state.idx=0;state.correct=0;state.wrong=[];state.questions=makeLevel(i);state.levelStartedAt=Date.now();startMusic();save();render()}
function savePlayer(i){let cls=$("cls").value.trim(),seat=$("seat").value.trim(),name=$("name").value.trim();if(!cls||!seat||!name){alert("請填寫班級、座號、姓名");return}state.cls=cls;state.seat=seat;state.name=name;save();chooseLevel(i)}
function resetProgress(){state.results=[];state.allWrong=[];state.score=0;save();home()}
function begin(){state={level:0,idx:0,score:0,correct:0,wrong:[],results:[],allWrong:[],questions:makeLevel(0),cls:$("cls").value,seat:$("seat").value,name:$("name").value};startMusic();save();render()}
function render(){let l=LEVELS[state.level],q=state.questions[state.idx];if(!q){endLevel();return}let total=state.questions.length;$("app").innerHTML='<div class="row"><h2>'+l.icon+' 第'+(state.level+1)+'關｜'+l.name+'</h2><span class="pill">'+(state.idx+1)+' / '+total+'</span></div><div class="row"><span>⭐ '+state.score+' 分</span></div><div class="bar"><div class="fill" style="width:'+(state.idx/total*100)+'%"></div></div><h2 style="color:white;margin-top:24px">'+esc(q.question)+'</h2><div id="choices">'+q.options.map((o,i)=>'<button class="option" onclick="answer('+i+')">'+("ABCD"[i])+'. '+esc(o)+'</button>').join('')+'</div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden" onclick="next()">下一題 ➜</button>';save()}
function answer(i){let q=state.questions[state.idx],ok=q.options[i]===q.answer;let buttons=[...document.querySelectorAll(".option")];buttons.forEach((b,j)=>{b.disabled=true;if(q.options[j]===q.answer)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});if(ok){state.correct++;state.score+=10}else{state.wrong.push({...q,chosen:q.options[i],level:LEVELS[state.level].name})}beep(ok);$("feedback").innerHTML=(ok?"✅ 答對！":"❌ 答錯！")+'<br>正確答案：'+esc(q.answer)+'<br><span class="muted">'+esc(q.note)+'</span>';$("next").classList.remove("hidden");$("next").textContent=state.idx===state.questions.length-1?"完成本關 🏆":"下一題 ➜";save()}

function duration(sec){sec=Math.max(0,Math.floor(sec||0));return Math.floor(sec/60)+"分"+String(sec%60).padStart(2,"0")+"秒"}
function encouragement(rate){return rate>=90?["🏆 傳說中的英文勇者","太精彩了！你的努力讓你成為真正的闖關高手！"]:rate>=75?["🥇 黃金冒險家","表現很棒！你已經掌握大部分重點，繼續保持！"]:rate>=60?["🥈 勇敢的挑戰者","你完成了重要的挑戰！複習錯題，下次會更進步！"]:["🌟 永不放棄的小勇者","願意挑戰到最後就是值得肯定的事！每一道錯題都是升級的機會！"]}
function endLevel(){let l=LEVELS[state.level],total=state.questions.length;state.results.push({level:l.name,correct:state.correct,total,score:state.correct*10,seconds:Math.max(0,Math.round((Date.now()-(state.levelStartedAt||Date.now()))/1000))});state.allWrong.push(...state.wrong);save();let pct=Math.round(state.correct/total*100),msg=encouragement(pct);$("app").innerHTML='<div style="text-align:center;font-size:55px">🎉🏅🎊</div><h2 style="text-align:center">'+l.icon+' '+esc(l.name)+' 闖關完成！</h2><p class="result" style="text-align:center">'+state.correct+' / '+total+' 題　'+pct+'%</p><h2 style="text-align:center;color:#facc15">'+msg[0]+'</h2><p style="text-align:center">'+msg[1]+'</p><p>⭐ 本關得分：'+state.correct*10+' 分｜累積：'+state.score+' 分</p><p>📖 本關錯題：'+state.wrong.length+' 題</p><button onclick="showLevelReview()">📚 查看本關錯題複習</button> <button class="primary" onclick="advance()">'+("返回自由選關 🎮")+'</button>'}
function showLevelReview(){showReview(state.wrong,"本關錯題複習","endLevelSummary()")}

function showReview(items,title,back){$("app").innerHTML='<h2>📚 '+esc(title)+'</h2>'+(items.length?items.map((q,i)=>'<div class="level"><strong>'+(i+1)+'. '+esc(q.question)+'</strong><p>你的答案：<span style="color:#fda4af">'+esc(q.chosen||"未記錄")+'</span></p><p>正確答案：<strong style="color:#86efac">'+esc(q.answer)+'</strong></p><p class="muted">'+esc(q.note)+'</p></div>').join(''):'<p>🎉 太棒了！沒有錯題！</p>')+'<button class="primary" onclick="'+back+'">返回 ➜</button>'}
function advance(){home()}
function wrongList(items){return items.length?items.map((q,i)=>{let note=q.note||"";let parts=note.split(" → ");let english=parts.length>1?parts[0]:q.question;let chinese=parts.length>1?parts.slice(1).join(" → "):q.answer;return '<div class="level"><strong>'+(i+1)+'. '+esc(english)+'</strong> — '+esc(chinese)+'</div>'}).join(''):'<div class="level">🎉 全部答對！沒有需要訂正的內容。</div>'}
function finish(){if(!state.results.length){home();return}let total=state.results.reduce((n,r)=>n+r.total,0),correct=state.results.reduce((n,r)=>n+r.correct,0),rate=Math.round(correct/total*100),msg=encouragement(rate);$("app").innerHTML='<div style="text-align:center;font-size:52px">🏆🎉✨</div><h1 style="text-align:center">冒險成績單</h1><div class="level" style="text-align:center"><p><strong>📸 截圖交給老師</strong></p><p>班級：'+esc(state.cls)+'　座號：'+esc(state.seat)+'</p><p>姓名：<strong>'+esc(state.name)+'</strong></p><p class="result">'+correct+' / '+total+' 題｜'+rate+'%</p><p>⭐ 總得分：'+state.score+' 分</p><h2 style="color:#facc15">'+msg[0]+'</h2><p>'+msg[1]+'</p></div><h2>📊 各關成績</h2>'+state.results.map(r=>'<div class="level">⭐ '+esc(r.level)+'：'+r.correct+' / '+r.total+'（'+Math.round(r.correct/r.total*100)+'%）｜⏱️ '+duration(r.seconds)+'</div>').join('')+'<p style="text-align:center">📱 請截圖上方成績單傳給老師，不需要下載檔案。</p><details class="level" style="margin-top:18px"><summary style="cursor:pointer;font-weight:700;color:#facc15;padding:8px 0">📚 展開／收合本次冒險錯題重點（'+state.allWrong.length+' 題）</summary><p>英文與中文對照，方便快速複習。</p>'+wrongList(state.allWrong)+'</details><p>🌱 訂正一題，就比剛才更進步一步！</p><button onclick="certificate()">🎓 產生學習成果證書</button><p></p><button class="primary" onclick="retryWrong()">⚔️ 再挑戰全部錯題</button> <button onclick="home()">🎮 返回自由選關</button>';save()}
function certificate(){if(!state.results.length){home();return}let total=state.results.reduce((n,r)=>n+r.total,0),correct=state.results.reduce((n,r)=>n+r.correct,0),rate=Math.round(correct/total*100),msg=encouragement(rate),time=duration(state.results.reduce((n,r)=>n+(r.seconds||0),0));$("app").innerHTML='<div id="certificate" style="background:#fffdf5;color:#182d4b;border:9px double #c9a44a;border-radius:10px;padding:28px 18px;text-align:center"><div style="font-size:40px">🎓🏅</div><h1 style="color:#8b6417;font-size:32px">英語學習成果證書</h1><p style="letter-spacing:2px">114 統測英文第36–38題｜超級電腦 RPG</p><hr style="border:1px solid #dbc58b"><p>茲證明</p><h2 style="color:#172d4b;font-size:30px">'+esc(state.name)+'</h2><p>'+esc(state.cls)+'　座號 '+esc(state.seat)+'</p><p>已完成英語複習遊戲挑戰</p><p style="font-size:24px;font-weight:bold;color:#8b6417">'+msg[0]+'</p><p>答對 '+correct+' / '+total+' 題｜答對率 '+rate+'%</p><p style="font-size:27px;font-weight:bold">總成績 '+state.score+' 分</p><p>累積作答時間：'+time+'</p><div style="text-align:left;margin:20px auto;max-width:400px"><strong>各關學習紀錄</strong>'+state.results.map(r=>'<p>'+esc(r.level)+'：'+r.correct+'/'+r.total+' 題｜'+duration(r.seconds)+'</p>').join('')+'</div><p>'+msg[1]+'</p><p style="font-size:13px;color:#526078">完成日期：'+new Date().toLocaleDateString("zh-TW")+'</p><p style="font-size:12px;color:#526078">本證書由學生完成遊戲後產生，供自主學習歷程紀錄使用。</p></div><p style="text-align:center">📱 可截圖保存，或使用「列印／儲存 PDF」上傳學習歷程檔案。</p><button class="primary" onclick="window.print()">🖨️ 列印／儲存 PDF 證書</button> <button onclick="finish()">返回成績與錯題</button>'}
function retryWrong(){if(!state.allWrong.length){finish();return}let qs=state.allWrong.map(q=>({...q,options:shuffle(Array.isArray(q.options)&&q.options.length?q.options:[q.answer,q.chosen||"其他","以上皆非","不適用"].filter((v,i,a)=>a.indexOf(v)===i))}));state.reviewQueue=qs;state.reviewIndex=0;state.reviewCorrect=0;renderRetry()}
function renderRetry(){let q=state.reviewQueue[state.reviewIndex];if(!q){$("app").innerHTML='<div style="text-align:center;font-size:55px">🎊🌟</div><h2>錯題再挑戰完成！</h2><p class="result">答對 '+state.reviewCorrect+' / '+state.reviewQueue.length+' 題</p><p>你願意再試一次，就是最棒的進步！</p><button class="primary" onclick="finish()">返回冒險成績單</button>';return}$("app").innerHTML='<h2>⚔️ 錯題再挑戰 '+(state.reviewIndex+1)+' / '+state.reviewQueue.length+'</h2><h2>'+esc(q.question)+'</h2>'+q.options.map((o,i)=>'<button class="option" onclick="answerRetry('+i+')">'+("ABCD"[i])+'. '+esc(o)+'</button>').join('')+'<p id="retryFeedback"></p><button id="retryNext" class="primary hidden" onclick="state.reviewIndex++;renderRetry()">下一題 ➜</button>'}
function answerRetry(i){let q=state.reviewQueue[state.reviewIndex],ok=q.options[i]===q.answer;document.querySelectorAll(".option").forEach((b,j)=>{b.disabled=true;if(q.options[j]===q.answer)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});if(ok)state.reviewCorrect++;beep(ok);$("retryFeedback").textContent=(ok?"✅ 太棒了！":"💪 再記住這個重點：")+q.note;$("retryNext").classList.remove("hidden")}

if(new URLSearchParams(location.search).get("preview")==="result"){
state.cls="示範班級";state.seat="01";state.name="測試學生";state.score=70;
state.results=[{level:"單字迷宮",correct:7,total:10,seconds:130}];
state.allWrong=[{...makeQs(DATA.words,"zh",1)[0],chosen:"示範錯誤選項"},{...fromTriple(FACTS[6]),chosen:"三天"},{...fromTriple(EXAMS[1]),chosen:"the pandemic"}];finish();
}else{home();}
</script></body></html>
