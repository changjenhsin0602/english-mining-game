<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>114統測英文第二大題｜五關RPG</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#223b70,#080e20 75%);color:#f8fafc;font:18px/1.5 system-ui,"Noto Sans TC",sans-serif;min-height:100vh}main{max-width:740px;margin:auto;padding:20px 16px 70px}.panel{background:#15223c;border:2px solid #3d5a89;border-radius:20px;padding:24px;box-shadow:0 12px 40px #0006;margin-top:16px}h1{font-size:clamp(26px,5vw,38px);margin:0 0 12px;color:#facc15}h2{font-size:24px;margin:0 0 12px;color:#93c5fd}p{margin:10px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 17px;background:#334a70;color:white}button:hover{filter:brightness(1.14)}button:disabled{opacity:.65;cursor:default}.primary{background:#facc15;color:#17213b;font-weight:800}.option{display:block;width:100%;text-align:left;margin:12px 0;padding:17px;border:2px solid #5974a4;background:#243653}.option.correct{background:#176c46;border-color:#4ade80}.option.wrong{background:#802b3d;border-color:#fb7185}.muted{color:#bac7de;font-size:15px}.bar{height:13px;background:#263753;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#facc15;transition:width .3s}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.level{padding:14px;border-radius:12px;background:#253756;margin:9px 0}.pill{font-size:14px;background:#3d527a;padding:6px 10px;border-radius:99px}.result{font-size:28px;color:#facc15}input{font:inherit;background:#f8fafc;color:#111827;padding:12px;border-radius:10px;border:0;width:100%;margin:6px 0 12px}@media(max-width:480px){.panel{padding:17px}.option{font-size:17px}}</style></head><body><main><div class="row"><div><h1>⚔️ 114 統測英文 RPG</h1><div class="muted">第二大題｜講義完整五關挑戰</div></div><button id="music" onclick="toggleMusic()">🔊 開啟音樂</button></div><section id="app" class="panel"></section></main><script>
const DATA={"words":[["plastic","塑膠"],["container","容器"],["straw","吸管"],["chemical","化學物質"],["chemical-free","不含化學物質的"],["fresh","新鮮的"],["vendor","攤販"],["customer","顧客"],["interview","面試"],["impression","印象"],["formal","正式的"],["professional","專業的"],["incredible","難以置信的"],["teamwork","團隊合作"],["impressive","令人印象深刻的"],["motivate","激勵"],["medal","獎牌"],["offer","提供"],["hardly","幾乎不"],["scarf","圍巾"],["silk","絲綢"],["sculpture","雕塑"],["passionate","熱情的"],["background","背景"],["outcome","結果"],["invent","發明"],["actually","事實上"],["scientist","科學家"]],"phrases":[["use ... less","少用……"],["too much","太多"],["hurt one's eyes","傷害眼睛"],["go jogging","慢跑"],["break down","分解；故障"],["throw away","丟棄"],["use less plastic","少用塑膠"],["carry one’s own water bottle","自備水瓶"],["straight from the farm","直接從農場來"],["cut in line","插隊"],["No way.","絕不；不行"],["go to the back of the line","排到隊伍後面"],["in time","及時"],["dress properly","穿著得體"],["job interview","工作面試"],["first impression","第一印象"],["win a gold medal","獲得金牌"],["offer one's seat to someone","讓座給某人"],["keep one's eyes open","睜開眼睛"],["look tired","看起來疲倦"],["be made of","由……製成"],["be passionate about","熱愛……"],["major in","主修"],["be excited to + V","很高興做……"],["as soon as possible","盡快"],["light bulb","燈泡"],["come up with","想出"]],"grammar":[["should + VR","應該做……"],["too much + 不可數名詞；too many + 可數複數名詞","太多……"],["look + 形容詞","看起來……（連綴動詞）"],["What does + S + look like?","詢問外觀或長相"],["be made of + 材料","由……製成"],["be passionate about + N / V-ing","熱愛……；about 為介系詞"],["major in + 學科","主修……"],["have / has + p.p.","現在完成式"],["had + p.p.","過去完成式"]],"synonyms":[["cut in line","jump the queue"],["come up with","think of"],["motivate","encourage"],["incredible","unbelievable"],["throw away","discard"],["properly","correctly"]]};
const LEVELS=[{name:"單字迷宮",icon:"📘",items:DATA.words,type:"zh"},{name:"片語森林",icon:"🌲",items:DATA.phrases,type:"zh"},{name:"文法城堡",icon:"🏰",items:DATA.grammar,type:"zh"},{name:"同義字神殿",icon:"🔮",items:DATA.synonyms,type:"syn"},{name:"終極魔王",icon:"🐉",items:[],type:"mix"}];
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let state={level:0,idx:0,score:0,hp:5,correct:0,wrong:[],results:[],allWrong:[],questions:[],name:"",cls:"",seat:""};let musicOn=false,ctx=null,timer=null,beat=0;const melody=[330,392,440,392,330,294,262,294,330,392,494,440,392,330,294,262];
function tone(freq,t,dur,volume=.04){if(!ctx||ctx.state!=="running")return;let o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=freq;g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur)}
async function startMusic(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(ctx.state!=="running")return;musicOn=true;$("music").textContent="🔊 音樂：開";if(!timer)timer=setInterval(()=>{try{tone(melody[beat%melody.length],ctx.currentTime,.18,.07);if(beat%4===0)tone(130,ctx.currentTime,.12,.035);beat++}catch(e){}},220)}catch(e){$("music").textContent="🔊 點此開啟音樂"}}
function toggleMusic(){if(musicOn){musicOn=false;clearInterval(timer);timer=null;ctx?.suspend();$("music").textContent="🔇 音樂：關"}else startMusic()}
function beep(ok){try{tone(ok?660:175,ctx.currentTime,.16,.1)}catch(e){}}
function makeQs(items,type,limit){let pool=items.map(([en,zh])=>({en,zh}));return shuffle(pool).slice(0,limit||pool.length).map(q=>{let other=shuffle([...new Set(pool.filter(x=>x!==q).map(x=>x.zh))]).slice(0,3);if(other.length<3){let extras=type==="syn"?["create","provide","discard","correctly","encourage","unbelievable"]:["以上皆非","不正確","不適用","其他"];other=[...other,...extras.filter(x=>x!==q.zh&&!other.includes(x))].slice(0,3)}return {question:type==="syn"?"與「"+q.en+"」同義的是？":type==="grammar"?"「"+q.en+"」的文法重點是？":"「"+q.en+"」的中文意思是？",answer:q.zh,options:shuffle([q.zh,...other]),note:q.en+" → "+q.zh}})}
function makeLevel(n){if(n===4){let a=[...makeQs(DATA.words,"zh",5),...makeQs(DATA.phrases,"zh",5),...makeQs(DATA.grammar,"grammar",5),...makeQs(DATA.synonyms,"syn",5)];return shuffle(a)}return makeQs(LEVELS[n].items,n===2?"grammar":LEVELS[n].type)}
function save(){try{localStorage.setItem("english114rpg5",JSON.stringify(state))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem("english114rpg5"));if(x&&Array.isArray(x.results))state={...state,...x}}catch(e){}}
function home(){let count=DATA.words.length+DATA.phrases.length+DATA.grammar.length+DATA.synonyms.length;$("app").innerHTML='<h2>🎮 自由選關・想玩哪關就玩哪關</h2><p>講義 '+count+' 個重點，五關任選，不必按照順序，也不用通關才能玩下一關。</p>'+LEVELS.map((l,i)=>'<button class="level" style="display:block;width:100%;text-align:left;border:1px solid #5974a4" onclick="chooseLevel('+i+')">'+l.icon+' 第'+(i+1)+'關｜'+l.name+'　<span class="pill">'+(i===4?20:l.items.length)+'題</span>　▶ 立即挑戰</button>').join('')+'<p class="muted">每關可獨立挑戰，答題後有鼓勵回饋、錯題複習及重新挑戰。</p>'+(state.results.length?'<button onclick="finish()">🏆 查看累積成績</button> <button onclick="resetProgress()">重新開始記錄</button>':'')+'<p class="muted">可自由選擇關卡，無鎖關機制。</p>'}
function chooseLevel(i){state.level=i;state.idx=0;state.hp=5;state.correct=0;state.wrong=[];state.questions=makeLevel(i);startMusic();save();render()}
function resetProgress(){state.results=[];state.allWrong=[];state.score=0;save();home()}
function begin(){state={level:0,idx:0,score:0,hp:5,correct:0,wrong:[],results:[],allWrong:[],questions:makeLevel(0),cls:$("cls").value,seat:$("seat").value,name:$("name").value};startMusic();save();render()}
function render(){let l=LEVELS[state.level],q=state.questions[state.idx];if(!q){endLevel();return}let total=state.questions.length;$("app").innerHTML='<div class="row"><h2>'+l.icon+' 第'+(state.level+1)+'關｜'+l.name+'</h2><span class="pill">'+(state.idx+1)+' / '+total+'</span></div><div class="row"><span>❤️ '+state.hp+' / 5</span><span>⭐ '+state.score+' 分</span></div><div class="bar"><div class="fill" style="width:'+(state.idx/total*100)+'%"></div></div><h2 style="color:white;margin-top:24px">'+esc(q.question)+'</h2><div id="choices">'+q.options.map((o,i)=>'<button class="option" onclick="answer('+i+')">'+("ABCD"[i])+'. '+esc(o)+'</button>').join('')+'</div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden" onclick="next()">下一題 ➜</button>';save()}
function answer(i){let q=state.questions[state.idx],ok=q.options[i]===q.answer;let buttons=[...document.querySelectorAll(".option")];buttons.forEach((b,j)=>{b.disabled=true;if(q.options[j]===q.answer)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});if(ok){state.correct++;state.score+=10}else{state.hp=Math.max(0,state.hp-1);state.wrong.push({...q,chosen:q.options[i],level:LEVELS[state.level].name})}beep(ok);$("feedback").innerHTML=(ok?"✅ 答對！":"❌ 答錯！")+'<br>正確答案：'+esc(q.answer)+'<br><span class="muted">'+esc(q.note)+'</span>';$("next").classList.remove("hidden");$("next").textContent=state.idx===state.questions.length-1?"完成本關 🏆":"下一題 ➜";save()}
function next(){state.idx++;render()}
function encouragement(rate){return rate>=90?["🏆 傳說中的英文勇者","太精彩了！你的努力讓你成為真正的闖關高手！"]:rate>=75?["🥇 黃金冒險家","表現很棒！你已經掌握大部分重點，繼續保持！"]:rate>=60?["🥈 勇敢的挑戰者","你完成了重要的挑戰！複習錯題，下次會更進步！"]:["🌟 永不放棄的小勇者","願意挑戰到最後就是值得肯定的事！每一道錯題都是升級的機會！"]}
function endLevel(){let l=LEVELS[state.level],total=state.questions.length;state.results.push({level:l.name,correct:state.correct,total,score:state.correct*10});state.allWrong.push(...state.wrong);save();let pct=Math.round(state.correct/total*100),msg=encouragement(pct);$("app").innerHTML='<div style="text-align:center;font-size:55px">🎉🏅🎊</div><h2 style="text-align:center">'+l.icon+' '+esc(l.name)+' 闖關完成！</h2><p class="result" style="text-align:center">'+state.correct+' / '+total+' 題　'+pct+'%</p><h2 style="text-align:center;color:#facc15">'+msg[0]+'</h2><p style="text-align:center">'+msg[1]+'</p><p>⭐ 本關得分：'+state.correct*10+' 分｜累積：'+state.score+' 分</p><p>📖 本關錯題：'+state.wrong.length+' 題</p><button onclick="showLevelReview()">📚 查看本關錯題複習</button> <button class="primary" onclick="advance()">'+("返回自由選關 🎮")+'</button>'}
function showLevelReview(){showReview(state.wrong,"本關錯題複習","endLevelSummary()")}
function endLevelSummary(){let l=LEVELS[state.level],r=state.results[state.results.length-1];$("app").innerHTML='<h2>🎉 '+esc(l.name)+' 已完成</h2><p>答對 '+r.correct+' / '+r.total+' 題，繼續前進吧！</p><button class="primary" onclick="advance()">返回選關 ➜</button>'}
function showReview(items,title,back){$("app").innerHTML='<h2>📚 '+esc(title)+'</h2>'+(items.length?items.map((q,i)=>'<div class="level"><strong>'+(i+1)+'. '+esc(q.question)+'</strong><p>你的答案：<span style="color:#fda4af">'+esc(q.chosen||"未記錄")+'</span></p><p>正確答案：<strong style="color:#86efac">'+esc(q.answer)+'</strong></p><p class="muted">'+esc(q.note)+'</p></div>').join(''):'<p>🎉 太棒了！沒有錯題！</p>')+'<button class="primary" onclick="'+back+'">返回 ➜</button>'}
function advance(){home()}
function finish(){let total=state.results.reduce((n,r)=>n+r.total,0),correct=state.results.reduce((n,r)=>n+r.correct,0),rate=Math.round(correct/total*100),msg=encouragement(rate);$("app").innerHTML='<div style="text-align:center;font-size:64px">🏆🎉✨</div><h1 style="text-align:center">恭喜完成五關冒險！</h1><h2 style="text-align:center;color:#facc15">'+msg[0]+'</h2><p style="text-align:center">'+msg[1]+'</p><p class="result" style="text-align:center">'+correct+' / '+total+' 題｜'+rate+'%</p><p style="text-align:center">⭐ 總得分：'+state.score+' 分</p><h2>📊 冒險成績單</h2>'+state.results.map((r,i)=>'<div class="level">'+"⭐"+' 挑戰 '+(i+1)+'｜'+esc(r.level)+'：'+r.correct+' / '+r.total+'（'+Math.round(r.correct/r.total*100)+'%）</div>').join('')+'<h2>📚 錯題複習</h2><p>共有 '+state.allWrong.length+' 題需要再練習。每一次訂正，都讓你更接近滿分！</p><button class="primary" onclick="showReview(state.allWrong,\'全部錯題複習\',\'finish()\')">查看全部錯題與解析</button> <button onclick="retryWrong()">⚔️ 再挑戰錯題</button><p><button onclick="downloadCsv()">📥 下載成績 CSV</button> <button onclick="home()">🔄 返回自由選關</button></p><p class="muted">成績保存在本裝置，未自動上傳教師端。</p>';save()}
function retryWrong(){if(!state.allWrong.length){finish();return}let qs=state.allWrong.map(q=>({...q,options:shuffle(q.options)}));state.reviewQueue=qs;state.reviewIndex=0;state.reviewCorrect=0;renderRetry()}
function renderRetry(){let q=state.reviewQueue[state.reviewIndex];if(!q){$("app").innerHTML='<div style="text-align:center;font-size:55px">🎊🌟</div><h2>錯題再挑戰完成！</h2><p class="result">答對 '+state.reviewCorrect+' / '+state.reviewQueue.length+' 題</p><p>你願意再試一次，就是最棒的進步！</p><button class="primary" onclick="finish()">返回冒險成績單</button>';return}$("app").innerHTML='<h2>⚔️ 錯題再挑戰 '+(state.reviewIndex+1)+' / '+state.reviewQueue.length+'</h2><h2>'+esc(q.question)+'</h2>'+q.options.map((o,i)=>'<button class="option" onclick="answerRetry('+i+')">'+("ABCD"[i])+'. '+esc(o)+'</button>').join('')+'<p id="retryFeedback"></p><button id="retryNext" class="primary hidden" onclick="state.reviewIndex++;renderRetry()">下一題 ➜</button>'}
function answerRetry(i){let q=state.reviewQueue[state.reviewIndex],ok=q.options[i]===q.answer;document.querySelectorAll(".option").forEach((b,j)=>{b.disabled=true;if(q.options[j]===q.answer)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});if(ok)state.reviewCorrect++;beep(ok);$("retryFeedback").textContent=(ok?"✅ 太棒了！":"💪 再記住這個重點：")+q.note;$("retryNext").classList.remove("hidden")}
function downloadCsv(){let rows=[["班級","座號","姓名","關卡","答對","總題數","得分"],...state.results.map(r=>[state.cls,state.seat,state.name,r.level,r.correct,r.total,r.score])];let csv="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="114統測第二大題_五關成績.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
home();
</script></body></html>
