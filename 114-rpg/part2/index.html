<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>114統測英文｜第二大題 RPG 闖關</title><style>
:root{color-scheme:dark;--bg:#10152d;--panel:#20294a;--gold:#ffcf68;--blue:#7de7ff;--red:#ff6e87}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#354779,#10152d 65%);font-family:system-ui,"Noto Sans TC",sans-serif;color:white;min-height:100vh}main{max-width:620px;margin:auto;padding:22px 16px 45px}.card{background:#20294ae8;border:2px solid #4c5f93;border-radius:22px;padding:22px;box-shadow:0 12px 35px #050a1a80}h1{font-size:clamp(25px,6vw,36px);line-height:1.25;margin:12px 0;color:var(--gold)}h2{font-size:24px}.sub{color:#c8d5f6}.pill{display:inline-block;padding:5px 12px;border-radius:30px;background:#354675;color:#c5f1ff;font-weight:700;font-size:13px}.hero{font-size:65px;text-align:center;margin:10px}input,select,button{font:inherit}input,select{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #7e95c3;background:#101b37;color:white}button{border:0;border-radius:14px;padding:13px 16px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:default}.primary{background:linear-gradient(135deg,#ffe195,#ffae50);color:#39251a;width:100%;margin-top:12px}.choice{display:block;width:100%;text-align:left;background:#334574;color:white;margin:10px 0;border:2px solid #536da7;min-height:55px}.choice:active{transform:scale(.99)}.correct{background:#246b56!important;border-color:#7af5bc!important}.wrong{background:#7e3448!important;border-color:#ff9ca9!important}.stats{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;margin:14px 0}.bar{height:15px;background:#3a2338;border-radius:30px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#ff5979,#ffbc76);transition:width .25s}.monster{font-size:75px;text-align:center;margin:10px 0}.feedback{min-height:55px;line-height:1.6;font-weight:700}.hidden{display:none}.muted{color:#b7c7ea;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.music{background:#364771;color:#fff;font-size:13px}.footer{text-align:center;margin-top:20px;color:#aab9d9;font-size:12px}a{color:#a8edff}#question{font-size:clamp(21px,5vw,27px);line-height:1.5;min-height:78px}.tiny{font-size:12px}.trophy{font-size:75px;text-align:center}#next{margin-top:8px}
</style></head><body><main><div class="top"><span class="pill">⚔️ 114 統測英文 · 第二大題</span><button id="music" class="music" type="button">♫ 音樂：開</button></div><section id="start" class="card" style="margin-top:20px"><div class="hero">🧙‍♀️ 🐉</div><h1>對話秘境 RPG</h1><p class="sub">依第二大題重點講義設計：單字、片語、文法、同義字，共 15 題。每次重玩都會重新洗題與選項。</p><label>班級<input id="cls" placeholder="例如：一年甲班" maxlength="24"></label><label>座號<input id="seat" placeholder="例如：07" maxlength="4" inputmode="numeric"></label><label>姓名<input id="name" placeholder="請輸入姓名" maxlength="24"></label><label>選擇勇者<select id="hero"><option value="🧙‍♀️">🧙‍♀️ 魔法師</option><option value="🛡️">🛡️ 守護者</option><option value="🥷">🥷 忍者</option><option value="🧝">🧝 精靈</option></select></label><button class="primary" id="begin">開始闖關 ▶</button><p class="muted">答對 +10 分；答錯扣 1 顆愛心，答完 15 題結算。</p></section><section id="game" class="card hidden" style="margin-top:20px"><div class="stats"><span id="progress">第 1 / 15 題</span><span id="score">⭐ 0 分</span><span id="hearts">❤️❤️❤️❤️❤️</span></div><div class="bar"><div id="hp" style="width:100%"></div></div><div class="monster" id="monster">👾</div><span id="category" class="pill">Words</span><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary hidden">下一題 ➜</button></section><section id="end" class="card hidden" style="margin-top:20px"><div class="trophy" id="trophy">🏆</div><h1>闖關完成！</h1><h2 id="result"></h2><p id="details" class="sub"></p><button id="again" class="primary">重新挑戰（重新洗題）</button><button id="csv" class="primary" style="background:#9be2f4">下載本次成績 CSV</button><p class="muted">成績只保存在本裝置，尚未自動上傳教師排行榜。</p></section><p class="footer">題目依 114 統測第二大題重點講義編寫，非統測原題逐字重現。</p></main><script>
const BANK=[{"cat": "Words", "question": "motivate 的意思是？", "answer": "激勵", "options": ["激勵", "處罰", "丟棄", "描述"], "note": "motivate ≈ encourage"}, {"cat": "Words", "question": "hardly 的意思是？", "answer": "幾乎不", "options": ["幾乎不", "努力地", "立刻", "完全地"], "note": "hardly 帶有否定意味"}, {"cat": "Words", "question": "incredible 的意思是？", "answer": "難以置信的", "options": ["難以置信的", "正式的", "新鮮的", "專業的"], "note": "incredible = unbelievable"}, {"cat": "Words", "question": "impression 的意思是？", "answer": "印象", "options": ["印象", "容器", "獎牌", "背景"], "note": "first impression 第一印象"}, {"cat": "Words", "question": "chemical-free 的意思是？", "answer": "不含化學物質的", "options": ["不含化學物質的", "擁擠的", "由塑膠製成的", "昂貴的"], "note": ""}, {"cat": "Words", "question": "sculpture 的意思是？", "answer": "雕塑", "options": ["雕塑", "絲綢", "圍巾", "吸管"], "note": ""}, {"cat": "Words", "question": "passionate 的意思是？", "answer": "熱情的", "options": ["熱情的", "有毒的", "疲倦的", "空白的"], "note": "be passionate about 熱愛"}, {"cat": "Phrases", "question": "cut in line 的意思是？", "answer": "插隊", "options": ["插隊", "排隊", "讓座", "慢跑"], "note": "cut in line = jump the queue"}, {"cat": "Phrases", "question": "come up with 的意思是？", "answer": "想出", "options": ["想出", "放棄", "分解", "到達"], "note": "come up with = think of"}, {"cat": "Phrases", "question": "break down 在環保情境的意思是？", "answer": "分解", "options": ["分解", "激勵", "面試", "主修"], "note": "break down 也可指機器故障"}, {"cat": "Phrases", "question": "offer one’s seat to someone 的意思是？", "answer": "讓座給某人", "options": ["讓座給某人", "向某人借錢", "邀請某人面試", "對某人插隊"], "note": ""}, {"cat": "Phrases", "question": "straight from the farm 的意思是？", "answer": "直接從農場來", "options": ["直接從農場來", "到農場工作", "農場附近", "從農場離開"], "note": ""}, {"cat": "Grammar", "question": "should 後面應接哪一種動詞形式？", "answer": "原形動詞", "options": ["原形動詞", "過去式", "現在分詞", "過去分詞"], "note": "should + VR"}, {"cat": "Grammar", "question": "be passionate about 後面可以接哪一種形式？", "answer": "名詞或 V-ing", "options": ["名詞或 V-ing", "只能接原形動詞", "只能接過去式", "只能接 to V"], "note": "about 是介系詞"}, {"cat": "Grammar", "question": "What does the scarf look like? 是在詢問什麼？", "answer": "圍巾的外觀", "options": ["圍巾的外觀", "圍巾的價格", "圍巾的主人", "圍巾的用途"], "note": "What does + S + look like?"}];
const $=id=>document.getElementById(id);
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let questions=[],idx=0,score=0,hp=5,correct=0,answered=false,record=null,ctx=null,musicTimer=null,musicOn=true,musicStep=0;
var rockBass=[110,110,146.83,110,164.81,164.81,146.83,110,130.81,130.81,164.81,130.81,146.83,146.83,164.81,196];
var rockLead=[440,0,523.25,587.33,659.25,0,587.33,523.25,493.88,0,587.33,659.25,783.99,0,659.25,587.33];
function tone(freq,time,duration,type,vol){if(!freq||!ctx)return;var o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,time);g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(vol,time+0.012);g.gain.exponentialRampToValueAtTime(0.0001,time+duration);o.connect(g);g.connect(ctx.destination);o.start(time);o.stop(time+duration+0.02)}
function drum(time,snare){if(!ctx)return;var o=ctx.createOscillator(),g=ctx.createGain();o.type=snare?'triangle':'sine';o.frequency.setValueAtTime(snare?185:110,time);o.frequency.exponentialRampToValueAtTime(snare?70:48,time+0.09);g.gain.setValueAtTime(snare?0.065:0.11,time);g.gain.exponentialRampToValueAtTime(0.0001,time+0.12);o.connect(g);g.connect(ctx.destination);o.start(time);o.stop(time+0.13)}
function playMusicNote(){if(!ctx||!musicOn)return;try{var t=ctx.currentTime+0.02,i=musicStep%16;tone(rockBass[i],t,0.18,'sawtooth',0.022);tone(rockLead[i],t,0.18,'square',0.018);if(i%4===0)drum(t,false);if(i%4===2)drum(t,true);musicStep++}catch(e){}}
function startMusic(){if(!musicOn)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ctx)ctx=new C();if(ctx.state==='suspended')ctx.resume();if(!musicTimer){playMusicNote();musicTimer=setInterval(playMusicNote,205)}}catch(e){}}
function toggleMusic(){musicOn=!musicOn;$('music').textContent=musicOn?'♫ 音樂：開':'♫ 音樂：關';if(musicOn)startMusic();else if(ctx&&ctx.state==='running')ctx.suspend()}

$('music').onclick=toggleMusic;
function start(){startMusic();questions=shuffle(BANK).map(q=>({...q,options:shuffle(q.options)}));idx=0;score=0;hp=5;correct=0;record=null;$('start').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}
$('begin').onclick=()=>{if(!$('name').value.trim()){alert('請輸入姓名');$('name').focus();return}start()};$('again').onclick=start;
function render(){answered=false;const q=questions[idx];$('progress').textContent=`第 ${idx+1} / ${questions.length} 題`;$('score').textContent=`⭐ ${score} 分`;$('hearts').textContent='❤️'.repeat(hp)+'🖤'.repeat(5-hp);$('hp').style.width=(hp/5*100)+'%';$('category').textContent=q.cat;$('monster').textContent=['👾','🐲','🦇','🦂','👹'][idx%5];$('question').textContent=q.question;$('feedback').textContent='';$('next').classList.add('hidden');$('answers').innerHTML='';q.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${opt}`;b.onclick=()=>answer(opt,b);$('answers').appendChild(b)})}
function beep(freq){try{if(!ctx)return;tone(freq,ctx.currentTime,0.12,'sine',0.06)}catch(e){}}
function answer(opt,btn){if(answered)return;answered=true;let q=questions[idx],ok=opt===q.answer;if(ok){score+=10;correct++;btn.classList.add('correct');beep(440)}else{hp=Math.max(0,hp-1);btn.classList.add('wrong');beep(110)}[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===q.answer)b.classList.add('correct')});$('feedback').textContent=(ok?'✅ 答對了！':'❌ 正確答案：'+q.answer)+(q.note?'｜'+q.note:'');$('score').textContent=`⭐ ${score} 分`;$('hearts').textContent='❤️'.repeat(hp)+'🖤'.repeat(5-hp);$('hp').style.width=(hp/5*100)+'%';$('next').textContent=idx===questions.length-1?'查看成績 🏆':'下一題 ➜';$('next').classList.remove('hidden')}
$('next').onclick=()=>{idx++;if(idx<questions.length)render();else finish()};
function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('trophy').textContent=correct>=12?'🏆':correct>=8?'🥈':'💪';$('result').textContent=`${score} 分｜答對 ${correct} / ${questions.length} 題`;$('details').textContent=`${$('cls').value.trim()}　${$('seat').value.trim()} 號　${$('name').value.trim()}｜剩餘 ${hp} 顆愛心`;record={date:new Date().toLocaleString('zh-TW'),class:$('cls').value.trim(),seat:$('seat').value.trim(),name:$('name').value.trim(),score,correct,total:questions.length};}
$('csv').onclick=()=>{if(!record)return;let keys=['date','class','seat','name','score','correct','total'],csv='\ufeff'+keys.join(',')+'\r\n'+keys.map(k=>'"'+String(record[k]).replace(/"/g,'""')+'"').join(',');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='114統測第二大題_成績.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></body></html>
