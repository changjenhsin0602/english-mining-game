<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151b36"><title>114統測英文・勇者闖關</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#fff;background:linear-gradient(160deg,#10152b,#252653 60%,#172d3c);min-height:100dvh}main{max-width:560px;margin:auto;padding:18px 16px 35px}h1{font-size:24px;margin:8px 0}p{line-height:1.6}.sub{color:#b8c5eb;font-size:13px}.panel{background:#ffffff12;border:1px solid #ffffff25;border-radius:20px;padding:17px;margin:16px 0;box-shadow:0 10px 30px #0002}.hidden{display:none!important}.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hero{border:2px solid transparent;border-radius:16px;padding:12px 3px;text-align:center;background:#ffffff15;cursor:pointer;color:white;font-size:12px}.hero b{display:block;font-size:33px;margin-bottom:5px}.hero.sel{border-color:#ffe27b;background:#ffe27b22}button{font:inherit;cursor:pointer;touch-action:manipulation}.primary{width:100%;padding:15px;border:0;border-radius:14px;background:#f9c85e;color:#1d203b;font-weight:800;font-size:17px}.secondary{padding:10px 13px;border-radius:12px;background:#ffffff19;color:white;border:1px solid #ffffff3a}.arena{display:flex;justify-content:space-around;align-items:end;min-height:155px;background:radial-gradient(ellipse at bottom,#658a7970,transparent 70%);border-radius:18px}.fighter{text-align:center;font-size:65px;transition:transform .2s}.fighter small{display:block;font-size:12px;color:#e4e7f8}.monster{filter:drop-shadow(0 7px 4px #0005)}.hit{animation:hit .45s ease}.hurt{animation:hurt .45s ease}@keyframes hit{50%{transform:translateX(40px) scale(1.1)}}@keyframes hurt{50%{transform:translateX(-25px) rotate(-15deg)}}.bars{display:grid;grid-template-columns:1fr 1fr;gap:15px}.bar{height:12px;border-radius:12px;background:#0006;overflow:hidden}.fill{height:100%;width:100%;background:#59d29b;transition:width .3s}.red{background:#ff7881}.stat{display:flex;justify-content:space-between;font-size:12px;margin:6px 0}.q{font-size:20px;font-weight:750;line-height:1.5;margin:14px 0}.answers{display:grid;gap:10px}.choice{text-align:left;padding:14px;border-radius:13px;background:#ffffff13;border:1px solid #ffffff30;color:white;font-size:16px;min-height:53px}.choice:disabled{opacity:1}.choice.good{background:#1f7552;border-color:#83edb3}.choice.bad{background:#8e3c52;border-color:#ff9bb1}.feedback{white-space:pre-line;padding:12px;border-radius:12px;background:#ffffff15;line-height:1.6;margin-top:12px}.muted{color:#bfc9e8}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.review{padding:10px 0;border-bottom:1px solid #ffffff22}.review strong{color:#ffe49d}input{width:100%;font-size:16px;padding:13px;border:1px solid #ffffff4d;background:#101a37;color:white;border-radius:12px;margin:6px 0 10px}label{font-size:13px;color:#d5ddf7}.top{display:flex;justify-content:space-between;align-items:center}.chip{background:#ffffff22;padding:6px 10px;border-radius:20px;font-size:12px}.foot{text-align:center;color:#a6b3d7;font-size:12px;margin-top:15px}#study{max-height:52vh;overflow:auto}.shake{animation:hurt .45s ease}
</style></head><body><main><div class="top"><div><h1>⚔️ 114統測英文</h1><div class="sub">勇者闖關・第一、二大題重點複習</div></div><span class="chip">手機單頁版</span></div>
<div style="text-align:right"><button type="button" id="musicToggle" class="secondary">♫ 音樂：開</button></div><section id="home" class="panel"><h2>選擇你的英雄</h2><div class="heroes" id="heroes"></div><p class="muted small">每關15題，共2關。答對攻擊怪物10 HP，答錯怪物反擊5 HP。</p><label>班級（可留空）</label><input id="clazz" placeholder="例如：三甲"><label>座號（可留空）</label><input id="seat" placeholder="例如：07" inputmode="numeric"><label>姓名（可留空）</label><input id="student" placeholder="學生姓名"><button class="primary" id="start">開始冒險 ▶</button><p class="small muted">本機自動記錄闖關成績。此試玩版不會把成績傳到老師的雲端。</p></section>
<section id="game" class="hidden"><div class="panel"><div class="row"><strong id="levelname">第1關</strong><span id="counter" class="chip">第1/15題</span></div><div class="bars"><div><div class="stat"><span>勇者 HP</span><span id="heroHP">100</span></div><div class="bar"><div id="heroBar" class="fill"></div></div></div><div><div class="stat"><span>怪物 HP</span><span id="monsterHP">100</span></div><div class="bar"><div id="monsterBar" class="fill red"></div></div></div></div><div class="arena"><div id="fighter" class="fighter">🛡️<small>勇者</small></div><div id="enemy" class="fighter monster">👾<small>單字史萊姆</small></div></div><div class="row"><span id="scoreline" class="small muted">答對0題</span><button id="studybtn" class="secondary">📖 重點包</button></div></div><div class="panel"><div class="q" id="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="primary hidden" style="margin-top:12px">下一題 →</button></div></section>
<section id="studyPanel" class="panel hidden"><div class="row"><h2>📖 重要單字與片語</h2><button id="closeStudy" class="secondary">返回</button></div><div id="study"></div></section>
<section id="result" class="panel hidden"><h2 id="resulttitle">🎉 闖關完成</h2><div id="resultscore" style="font-size:36px;font-weight:900;text-align:center;margin:15px"></div><div id="wrongreview"></div><button id="continue" class="primary" style="margin-top:16px">繼續下一關 →</button><button id="csv" class="secondary" style="width:100%;margin-top:10px">下載本機成績 CSV</button><button id="restart" class="secondary" style="width:100%;margin-top:10px">重新開始</button></section><p class="foot">手機相容修正版・不需登入、不需安裝・本機成績只保存在目前裝置</p></main>
<script>

'use strict';const QUESTIONS=[{"q":"「draw」的中文意思是？","options":["畫；繪製","表現","攤販","珠寶"],"correct":0,"note":"draw＝畫；繪製"},{"q":"「crowded」的中文意思是？","options":["擁擠的","權力；職權","習慣","岸邊"],"correct":0,"note":"crowded＝擁擠的"},{"q":"「peak」的中文意思是？","options":["山峰","雕塑","團隊合作","牛群"],"correct":0,"note":"peak＝山峰"},{"q":"「portrait」的中文意思是？","options":["熱衷的","正式的","肖像","幾乎不"],"correct":2,"note":"portrait＝肖像"},{"q":"「poisonous」的中文意思是？","options":["牛群","新鮮的","有毒的","化學物質"],"correct":2,"note":"poisonous＝有毒的"},{"q":"「authority」的中文意思是？","options":["感應器","顧客","便宜貨；討價還價","權力；職權"],"correct":3,"note":"authority＝權力；職權"},{"q":"「sensor」的中文意思是？","options":["牛群","感應器","時髦的","新鮮的"],"correct":1,"note":"sensor＝感應器"},{"q":"「automatically」的中文意思是？","options":["山谷","自動地","幾乎不","完全地"],"correct":1,"note":"automatically＝自動地"},{"q":"「apparently」的中文意思是？","options":["圍巾","自動地","顯然地","傑出的；壯麗的"],"correct":2,"note":"apparently＝顯然地"},{"q":"「abandon」的中文意思是？","options":["放棄","印象","面試","獎牌"],"correct":0,"note":"abandon＝放棄"},{"q":"「magnificent」的中文意思是？","options":["畫；繪製","壯麗的；宏偉的","表現","攤販"],"correct":1,"note":"magnificent＝壯麗的；宏偉的"},{"q":"「performance」的中文意思是？","options":["表現；演出","畫；繪製","感應器","攤販"],"correct":0,"note":"performance＝表現；演出"},{"q":"「obviously」的中文意思是？","options":["畫；繪製","表現","攤販","顯然地"],"correct":3,"note":"obviously＝顯然地"},{"q":"「plastic」的中文意思是？","options":["畫；繪製","表現","塑膠","攤販"],"correct":2,"note":"plastic＝塑膠"},{"q":"「vendor」的中文意思是？","options":["畫；繪製","攤販","表現","珠寶"],"correct":1,"note":"vendor＝攤販"},{"q":"「draw pictures」的中文意思是？","options":["負責","由於；因為","畫圖","長得像"],"correct":2,"note":"draw pictures＝畫圖"},{"q":"「look alike」的中文意思是？","options":["燈泡","長得像","打開；啟動","畫圖"],"correct":1,"note":"look alike＝長得像"},{"q":"「stand out as」的中文意思是？","options":["酒後駕車","以……身分脫穎而出","盡快","負責"],"correct":1,"note":"stand out as＝以……身分脫穎而出"},{"q":"「due to」的中文意思是？","options":["分解","工作面試","由於；因為","主修……"],"correct":2,"note":"due to＝由於；因為"},{"q":"「give up」的中文意思是？","options":["放棄","丟掉","睜開眼睛","想出；提出"],"correct":0,"note":"give up＝放棄"},{"q":"「turn on」的中文意思是？","options":["畫；繪製","打開；啟動","壯麗的；宏偉的","表現"],"correct":1,"note":"turn on＝打開；啟動"},{"q":"「by oneself」的中文意思是？","options":["獨自；自行","畫；繪製","壯麗的；宏偉的","表現"],"correct":0,"note":"by oneself＝獨自；自行"},{"q":"「be in charge of」的中文意思是？","options":["畫；繪製","壯麗的；宏偉的","表現","負責"],"correct":3,"note":"be in charge of＝負責"},{"q":"「throw away」的中文意思是？","options":["畫；繪製","壯麗的；宏偉的","丟掉","表現"],"correct":2,"note":"throw away＝丟掉"},{"q":"「job interview」的中文意思是？","options":["畫；繪製","工作面試","壯麗的；宏偉的","表現"],"correct":1,"note":"job interview＝工作面試"},{"q":"「go jogging」的中文意思是？","options":["想出；提出","獨自；自行","主修……","去慢跑"],"correct":3,"note":"go jogging＝去慢跑"},{"q":"「break down」的中文意思是？","options":["想出；提出","分解","繼續","很期待……"],"correct":1,"note":"break down＝分解"},{"q":"「cut in line」的中文意思是？","options":["以……命名","打開；啟動","工作面試","插隊"],"correct":3,"note":"cut in line＝插隊"},{"q":"「be made of」的中文意思是？","options":["睜開眼睛","由……製成","以……命名","及時"],"correct":1,"note":"be made of＝由……製成"},{"q":"「come up with」的中文意思是？","options":["由於；因為","想出；提出","以……身分脫穎而出","酒後駕車"],"correct":1,"note":"come up with＝想出；提出"}];const SYNONYMS={
'draw':'sketch（素描；畫）','crowded':'packed（擁擠的）','peak':'summit（山頂）','portrait':'picture of a person（人物肖像）','poisonous':'toxic（有毒的）','authority':'power（權力）','sensor':'detector（偵測器）','automatically':'by itself（自動地）','apparently':'seemingly（看起來；似乎）','abandon':'give up（放棄）','magnificent':'splendid（壯麗的）','performance':'show（演出）','obviously':'clearly（顯然地）','plastic':'—','vendor':'seller（賣家；攤販）',
'draw pictures':'make drawings（畫圖）','look alike':'resemble each other（彼此相像）','stand out as':'be distinguished as（以……身分出眾）','due to':'because of（由於）','give up':'quit（放棄）','turn on':'switch on（打開）','by oneself':'on one’s own（獨自）','be in charge of':'be responsible for（負責）','throw away':'discard（丟棄）','job interview':'employment interview（求職面試）','go jogging':'go for a jog（去慢跑）','break down':'stop working（故障）；decompose（分解）','cut in line':'jump the queue（插隊）','be made of':'be composed of（由……組成；用法不完全相同）','come up with':'think of（想出）'};
const USAGE={
'avoid':'avoid + V-ing（避免做某事）',
'give up':'give up + V-ing（放棄做某事）',
'due to':'due to + N / V-ing（由於……）',
'turn on':'turn + 代名詞 + on（如 turn it on）',
'be made of':'be made of + 材料（由……製成）',
'look alike':'look alike（長得像）；look like + N（看起來像……）',
'be in charge of':'be in charge of + N / V-ing（負責……）'
};
function extraReview(q){var match=q.q.match(/「([^」]+)」/);var term=match&&match[1];if(!term)return '';var syn=SYNONYMS[term];var usage=USAGE[term];return (syn&&syn!=='—'?'\n同義字／片語：'+term+' = '+syn:'')+(usage?'\n特殊用法：'+usage:'')}

let questionOrder=[];let previousOrders={};function shuffleLevel(){let a=Array.from({length:15},(_,i)=>level*15+i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(previousOrders[level]&&a.every((n,i)=>n===previousOrders[level][i]))a.push(a.shift());previousOrders[level]=a.slice();questionOrder=a;}const HEROES=[['🛡️','騎士'],['🏹','弓箭手'],['🪄','魔法師'],['⚔️','女戰士']];let hero=0,level=0,pos=0,score=0,hp=100,mhp=100,wrong=[],records=[];const $=id=>document.getElementById(id);function show(id){for(const s of ['home','game','studyPanel','result'])$(s).classList.toggle('hidden',s!==id)}function heroes(){ $('heroes').innerHTML='';HEROES.forEach(([emoji,name],i)=>{let b=document.createElement('button');b.type='button';b.className='hero'+(hero===i?' sel':'');b.innerHTML='<b>'+emoji+'</b>'+name;b.onclick=()=>{hero=i;heroes()};$('heroes').append(b)})}function render(){show('game');$('levelname').textContent='第'+(level+1)+'關・'+(level?'片語森林':'單字村');$('counter').textContent='第'+(pos+1)+'/15題';$('heroHP').textContent=hp+'/100';$('monsterHP').textContent=mhp+'/100';$('heroBar').style.width=hp+'%';$('monsterBar').style.width=mhp+'%';$('fighter').innerHTML=HEROES[hero][0]+'<small>'+HEROES[hero][1]+'</small>';$('enemy').innerHTML=(level?'🐲':'👾')+'<small>'+(level?'片語龍':'單字史萊姆')+'</small>';$('scoreline').textContent='本關答對 '+score+' 題';let q=QUESTIONS[questionOrder[pos]];$('question').textContent=q.q;$('answers').innerHTML='';q.options.forEach((option,i)=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent='ABCD'[i]+'. '+option;b.onclick=()=>answer(i);$('answers').append(b)});$('feedback').classList.add('hidden');$('next').classList.add('hidden')}function answer(i){let q=QUESTIONS[questionOrder[pos]],ok=i===q.correct;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('good');else if(j===i)b.classList.add('bad')});if(ok){score++;mhp=Math.max(0,mhp-10);$('fighter').classList.add('hit')}else{hp=Math.max(0,hp-5);wrong.push(q);$('enemy').classList.add('hurt')}setTimeout(()=>{$('fighter').classList.remove('hit');$('enemy').classList.remove('hurt')},500);$('heroHP').textContent=hp+'/100';$('monsterHP').textContent=mhp+'/100';$('heroBar').style.width=hp+'%';$('monsterBar').style.width=mhp+'%';$('scoreline').textContent='本關答對 '+score+' 題';var review=extraReview(q).trim();$('feedback').textContent=review;$('feedback').classList.toggle('hidden',!review);$('next').textContent=pos===14?'查看本關成績 →':'下一題 →';$('next').classList.remove('hidden')}function finish(){show('result');$('resulttitle').textContent=score===15?'🏆 完美勝利！':'🎉 第'+(level+1)+'關完成';$('resultscore').textContent=score+' / 15';let rec={date:new Date().toLocaleString('zh-TW'),clazz:$('clazz').value,seat:$('seat').value,student:$('student').value,level:level+1,correct:score,total:15};records.push(rec);try{localStorage.setItem('english114_records',JSON.stringify(records))}catch(e){}$('wrongreview').innerHTML='';if(wrong.length){let h=document.createElement('h3');h.textContent='錯題複習';$('wrongreview').append(h);wrong.forEach(q=>{let d=document.createElement('div');d.className='review';let t=document.createElement('div');t.textContent=q.q;let a=document.createElement('strong');a.textContent='正解：'+q.options[q.correct]+extraReview(q);d.append(t,a);$('wrongreview').append(d)})}else{$('wrongreview').textContent='全部答對，太厲害了！'}$('continue').textContent=level===0?'挑戰第二關 →':'兩關完成・重新挑戰 ↻'}function startLevel(){shuffleLevel();pos=0;score=0;hp=100;mhp=100;wrong=[];render()}$('start').addEventListener('click',function(event){event.preventDefault();level=0;startLevel();startMusic();});$('next').onclick=()=>{if(pos===14)finish();else{pos++;render()}};$('continue').onclick=()=>{if(level===0){level=1;startLevel()}else{level=0;startLevel()}};$('restart').onclick=()=>{level=0;show('home')};$('studybtn').onclick=()=>{show('studyPanel')};$('closeStudy').onclick=()=>{show('game')};$('study').innerHTML=QUESTIONS.map(q=>'<div class="review"><strong>'+q.note+'</strong></div>').join('');var musicCtx=null,musicTimer=null,musicEnabled=true,musicStep=0;
// 一首原創、循環的輕快搖滾風格配樂；使用者按開始後才啟動，符合手機音訊政策。
var rockBass=[110,110,146.83,110,164.81,164.81,146.83,110,130.81,130.81,164.81,130.81,146.83,146.83,164.81,196];
var rockLead=[440,0,523.25,587.33,659.25,0,587.33,523.25,493.88,0,587.33,659.25,783.99,0,659.25,587.33];
function tone(freq,time,duration,type,vol){if(!freq||!musicCtx)return;var o=musicCtx.createOscillator(),g=musicCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,time);g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(vol,time+0.012);g.gain.exponentialRampToValueAtTime(0.0001,time+duration);o.connect(g);g.connect(musicCtx.destination);o.start(time);o.stop(time+duration+0.02)}
function drum(time,snare){if(!musicCtx)return;var o=musicCtx.createOscillator(),g=musicCtx.createGain();o.type=snare?'triangle':'sine';o.frequency.setValueAtTime(snare?185:110,time);o.frequency.exponentialRampToValueAtTime(snare?70:48,time+0.09);g.gain.setValueAtTime(snare?0.065:0.11,time);g.gain.exponentialRampToValueAtTime(0.0001,time+0.12);o.connect(g);g.connect(musicCtx.destination);o.start(time);o.stop(time+0.13)}
function playMusicNote(){if(!musicCtx||!musicEnabled)return;try{var t=musicCtx.currentTime+0.02,i=musicStep%16;tone(rockBass[i],t,0.18,'sawtooth',0.022);tone(rockLead[i],t,0.18,'square',0.018);if(i%4===0)drum(t,false);if(i%4===2)drum(t,true);musicStep++}catch(e){}}
function startMusic(){if(!musicEnabled)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!musicCtx)musicCtx=new C();if(musicCtx.state==='suspended')musicCtx.resume();if(!musicTimer){playMusicNote();musicTimer=setInterval(playMusicNote,205)}}catch(e){}}
function toggleMusic(){musicEnabled=!musicEnabled;$('musicToggle').textContent=musicEnabled?'♫ 音樂：開':'♫ 音樂：關';if(musicEnabled)startMusic();else if(musicCtx&&musicCtx.state==='running')musicCtx.suspend()}
$('musicToggle').addEventListener('click',toggleMusic);
$('csv').onclick=()=>{let rows=[['日期','班級','座號','姓名','關卡','答對','總題數'],...records.map(x=>[x.date,x.clazz,x.seat,x.student,x.level,x.correct,x.total])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='114統測英文_本機闖關成績.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};try{records=JSON.parse(localStorage.getItem('english114_records')||'[]')}catch(e){records=[]}heroes();
</script></body></html>
